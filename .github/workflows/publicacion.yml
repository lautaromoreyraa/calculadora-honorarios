# Publicación en Cloudflare Workers: corre sólo al llegar algo a main, que es lo
# publicado. Repite la verificación antes de subir, para que un push directo o
# un merge con la verificación vieja no publique algo roto.
# Las acciones van fijadas por SHA para que un tag movido no cambie lo que corre.
name: Publicación

on:
  push:
    branches: [main]

permissions:
  contents: read

# Dos merges seguidos no se pisan: el segundo espera, y gana el último.
concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validar-datos
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # Token con permiso sólo para editar Workers de la cuenta; vive en el
          # entorno «produccion» de GitHub, no en el repo.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: deploy
