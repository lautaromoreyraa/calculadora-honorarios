name: Publicación

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Rama o commit a publicar; la Action del dólar pasa main ya mergeada
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validar-datos
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Subir a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler="npx --yes wrangler@4.147.0"
          $wrangler pages project create calculadora-honorarios-nea --production-branch=main || true
          $wrangler pages deploy dist --project-name=calculadora-honorarios-nea --branch=main
