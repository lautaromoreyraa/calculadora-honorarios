name: Verificación

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validar-datos
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SUMA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SUMA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if ! git show "${BASE}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks.toml" 2>/dev/null; then
            echo '[extend]' > "${RUNNER_TEMP}/gitleaks.toml"
            echo 'useDefault = true' >> "${RUNNER_TEMP}/gitleaks.toml"
          fi
          ./gitleaks git --config "${RUNNER_TEMP}/gitleaks.toml" --redact --no-banner --log-opts "${BASE}..HEAD" .
