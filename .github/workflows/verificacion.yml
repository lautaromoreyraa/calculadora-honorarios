# Verificación de cada PR: si algo de esto falla, el PR no se mergea.
# Las acciones van fijadas por SHA para que un tag movido no cambie lo que corre.
name: Verificación

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validar-datos
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc -b (tipos) + vite build
