# Nafta súper por provincia (RF-22): mediana del precio diurno informado en
# los últimos 60 días en el dataset «Precios en surtidor» de la Secretaría de
# Energía (RN-10). Corre una vez por semana; si cambió el precio o la cantidad
# de estaciones de alguna provincia, abre un PR a main que toca sólo
# datos/combustible.json, con la tabla de valores, lo mergea y publica, como
# las cotizaciones y los índices (RF-23). Una provincia con menos de 5
# estaciones conserva su precio anterior.
#
# El CSV sólo se sirve por http (el https redirige a http): alguien en el
# camino podría cambiarlo dentro del rango de RF-23. Lautaro decidió el
# 2026-11-10 que igual se mergee solo; la tabla queda en el PR para auditarlo.
#
# Un CSV con otra forma o un salto fuera del rango de RF-23 hacen fallar el
# script: no hay PR y la corrida queda en rojo a la vista.
# Las acciones van fijadas por SHA para que un tag movido no cambie lo que corre.
#
# Dos jobs (RNF-07): el que instala dependencias y las ejecuta no tiene ningún
# permiso de escritura; el que puede escribir no instala ni ejecuta nada de
# terceros.
name: Nafta en surtidor

on:
  schedule:
    # Los lunes a las 13:00 UTC = 10:00 en Argentina.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# El mismo grupo que las cotizaciones y los índices: todos mergean a main y
# sincronizan develop, y no tienen que pisarse.
concurrency:
  group: dolar-blue
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cambio: ${{ steps.nafta.outputs.cambio }}
      fecha: ${{ steps.nafta.outputs.fecha }}
      titulo: ${{ steps.nafta.outputs.titulo }}
      tabla: ${{ steps.nafta.outputs.tabla }}
      parche: ${{ steps.parche.outputs.parche }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Antes de npm ci: el script sólo usa código del repo, y el parche queda
      # fijado antes de que corra cualquier dependencia.
      - id: nafta
        run: npm run actualizar-combustible
      - id: parche
        if: steps.nafta.outputs.cambio == 'true'
        run: |
          # El PR tiene que tocar sólo el combustible: si no, no se mergea solo (RF-23).
          node scripts/controlar-archivos.ts datos/combustible.json
          echo "parche=$(git diff | base64 -w0)" >> "$GITHUB_OUTPUT"
      - if: steps.nafta.outputs.cambio == 'true'
        run: npm ci
      - if: steps.nafta.outputs.cambio == 'true'
        run: npm run validar-datos
      - if: steps.nafta.outputs.cambio == 'true'
        run: npm run lint
      - if: steps.nafta.outputs.cambio == 'true'
        run: npm test
      - if: steps.nafta.outputs.cambio == 'true'
        run: npm run build

  integrar:
    needs: consultar
    if: needs.consultar.outputs.cambio == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FECHA: ${{ needs.consultar.outputs.fecha }}
      TITULO: ${{ needs.consultar.outputs.titulo }}
      PARCHE: ${{ needs.consultar.outputs.parche }}
      TABLA: ${{ needs.consultar.outputs.tabla }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Rama y commit
        run: |
          echo "$PARCHE" | base64 -d | git apply
          test "$(git status --porcelain)" = " M datos/combustible.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "datos/nafta-$FECHA"
          git commit -am "RF-22: nafta súper a $(echo "$TITULO" | base64 -d)"
      # Un PR abierto con este token no dispara el workflow de verificación: la
      # verificación ya corrió sobre este mismo cambio en el job anterior.
      - name: PR a main y merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rama="datos/nafta-$FECHA"
          git push origin "$rama"
          # Comillas simples: el texto lleva backticks de Markdown y no se ejecutan.
          cuerpo='Precio de la nafta súper por provincia: mediana del precio diurno de los últimos 60 días (RN-10), desde «Precios en surtidor» de la Secretaría de Energía. Toca sólo `datos/combustible.json`; validación de datos, lint, tests y build pasaron en esta corrida.'
          cuerpo="$cuerpo"$'\n\n'"$(echo "$TABLA" | base64 -d)"
          cuerpo="$cuerpo"$'\n\n''El CSV llega por http: si un precio no cierra, comparalo con https://preciosensurtidor.energia.gob.ar/.'
          gh pr create --base main --head "$rama" \
            --title "RF-22: nafta súper a $(echo "$TITULO" | base64 -d)" \
            --body "$cuerpo"
          gh pr merge "$rama" --merge --delete-branch
      - name: Sincronizar develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main develop
          git switch develop
          if git merge --no-ff origin/main -m "Merge main: nafta del $FECHA"; then
            git push origin develop
          else
            git merge --abort
            gh pr create --base develop --head main --title "Sincronizar develop con la nafta del $FECHA" \
              --body "El merge automático de main en develop tuvo conflictos: resolver a mano." || true
          fi

  publicar:
    needs: integrar
    uses: ./.github/workflows/publicacion.yml
    with:
      ref: main
    secrets: inherit
